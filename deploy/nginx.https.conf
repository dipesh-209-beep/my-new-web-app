# deploy/nginx.https.conf
#
# Production ingress: the HTTP listener in deploy/nginx.conf, plus real TLS
# termination, an HTTP->HTTPS redirect, HSTS, and a rate limit that matches
# the application's. Mounted over /etc/nginx/nginx.conf by
# docker-compose.prod.yml.
#
# Why a separate file rather than a commented-out block inside
# deploy/nginx.conf: nginx has no "if a cert exists" condition. A config
# that references /etc/nginx/certs/* when those files are absent fails to
# start with a file-not-found error, which is a confusing way to find out
# you haven't deployed yet. Two files means each is valid for the situation
# it exists in, and `make nginx-check` can validate both.
#
# What this file is responsible for, and what it is not:
#
#   * TLS 1.2+ only, with HSTS. HSTS is why the redirect is safe to send
#     unconditionally: after one visit the browser refuses to try plain
#     HTTP at all, so a network attacker can no longer strip the redirect.
#     max-age is a year. Once you ship that, a host you cannot serve TLS
#     on becomes unreachable for a year for anyone who has visited -- which
#     is the intended trade, but is the reason to only turn this on once
#     TLS is genuinely working.
#   * /admin/login is limited to 10 requests/minute per IP with a burst of
#     2, matching the application's own limit in
#     backend/app/api/admin_auth.py. The two used to disagree (nginx at
#     5r/m, the app at 10/min), which silently made the app's deliberate
#     10/min setting unreachable: the effective limit was nginx's 5+2.
#     Two layers at the same threshold means the app's limit is the real
#     one, and the app's limit is what's tested. Change one, change the
#     other, and the comment here is the reminder.
#   * A coarse global limit as DoS baseline, generous enough not to
#     affect normal use. Per-endpoint limits (suggestion submission,
#     route lookups) are the application's job.
#   * Security headers on responses nginx generates itself, so a 502 or a
#     413 from nginx carries the same headers as a response from the app.
#     The app sets these too (see the security-headers middleware in
#     app/main.py); the duplication is deliberate rather than accidental,
#     because only nginx can decorate its own error pages.
#
# CSP is intentionally absent. This server only ever returns JSON from
# /app; a Content-Security-Policy belongs on whatever actually serves HTML
# (the Next.js frontend, port 3000), where it can name real script/style
# sources. Setting a guess here would be a policy nobody maintains.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # Do not advertise the nginx version in Server headers or on error
    # pages. Cheap, and it removes a free version fingerprint.
    server_tokens off;

    # The largest legitimate payload is an admin POST /stops or /routes JSON
    # body, nowhere near this.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    # Shared across worker processes (unlike an in-process counter), so the
    # limit is accurate with any number of nginx workers, with no Redis
    # involved -- which matters because this file has to keep working even
    # if the application's own rate-limit store is down.
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;

    # Rate-limit accounting that trusts X-Forwarded-For. Deliberately NOT
    # set by default: $remote_addr is nginx's TCP peer, which is the real
    # client only when nginx is the edge. docker-compose.prod.yml mounts
    # deploy/realip_trusted.conf, which enables this with a `set_real_ip_from`
    # restricted to the load balancer / CDN ranges in front of this box. If
    # you enable the header without restricting `set_real_ip_from`, any
    # client can spoof its address and get a fresh rate-limit bucket per
    # request -- i.e. the limit stops existing. That is the same
    # precondition TRUST_PROXY_HEADERS has on the application side.
    # include /etc/nginx/realip_trusted.conf;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ACME http-01 challenge. certbot's --webroot writes here; this location
    # must stay on the plain-HTTP listener or renewal can never succeed.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # 308 preserves the method and body, so this is safe for
            # non-GET requests too; 301/302 would let some clients turn a
            # POST into a GET.
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS 1.2 is the floor. 1.0/1.1 are broken (BEAST, POODLE, Lucky
        # 13) and no client that matters still needs them.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;   # let the client choose; 1.3 ciphers
                                         # are better ordered than any static list
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # HSTS. See the header comment: only appropriate once TLS is real.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Server-side request forgery is the one this API genuinely has to
        # care about: /route-finder and /walking-route cause the *server* to
        # make an outbound HTTP request to OSRM_BASE_URL. If those URLs are
        # ever operator-configurable, a browser-supplied value here would
        # turn this proxy into a request forwarder. They are not
        # configurable at runtime today, which is the real mitigation; this
        # header is the second layer.
        proxy_set_header Host $host;

        location /admin/login {
            limit_req zone=admin_login burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            limit_req zone=api_global burst=60 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
