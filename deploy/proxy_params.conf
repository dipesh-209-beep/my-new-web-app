# deploy/proxy_params.conf
#
# Standard reverse-proxy headers, shared by every location block in
# nginx.conf and nginx.https.conf. Split out so the HTTP and HTTPS server
# blocks stay in sync automatically instead of duplicating this list.
#
# Included from inside a `location` block, so these apply per proxied
# request rather than at server scope.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# OVERWRITE, not append ($proxy_add_x_forwarded_for). nginx is the sole
# edge (see docker-compose.prod.yml: the backend publishes no port), so
# the real client is $remote_addr and nothing else. Appending kept any
# client-supplied X-Forwarded-For to the left of the real address, and
# the backend used to read that leftmost value -- letting any client
# choose its own rate-limit bucket and falsify its audit client IP by
# sending a forged header (AUD-001). Overwriting drops the client's copy
# entirely, so the header the backend sees has exactly one value: the
# address nginx actually accepted the TCP connection from.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# The application sets these same three headers on its own responses (the
# security-headers middleware in app/main.py). Suppress the application's
# copies on proxied responses so a client sees exactly one of each, from
# the outermost layer that set them. Without this, every response carries
# each header twice, which is untidy and is something security scanners
# report as a finding.
#
# The application's own copies are still what you get when talking to the
# backend directly (the dev workflow, or any deployment that doesn't front
# it with nginx) -- which is why the duplication is resolved here rather
# than by deleting the middleware.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;

# Client IP for rate limiting and audit rows. The backend reads
# X-Forwarded-For/X-Real-IP only when TRUST_PROXY_HEADERS is on, and only
# then when the header carries a single well-formed address
# (app/core/request_context.py::get_client_ip) -- a chain is refused and
# the socket peer is used instead. Because this file overwrites both
# headers with $remote_addr, that single value IS the real client, so the
# precondition holds as long as nginx is the only path to the backend.
# If a load balancer is ever placed in front of nginx, do not append here:
# enable nginx's real_ip module with `set_real_ip_from` for that balancer's
# ranges instead, so $remote_addr (and therefore this header) is still the
# true client.

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
