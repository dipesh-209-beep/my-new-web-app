# deploy/proxy_params.conf
#
# Standard reverse-proxy headers, shared by every location block in
# nginx.conf. Split out so both the HTTP and (eventually) HTTPS server
# blocks stay in sync automatically instead of duplicating this list.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The backend's slowapi rate limiter (backend/app/core/rate_limit.py)
# keys on the request's remote address via get_remote_address, which
# reads the direct TCP peer -- once nginx sits in front of it, that peer
# is always nginx itself, not the real client, unless the backend is
# taught to trust X-Forwarded-For. That's a backend-side change (a
# ProxyHeadersMiddleware or equivalent), not something nginx can fix on
# its own by sending the header -- noting it here so it isn't a silent
# gap: as configured today, slowapi's per-IP limiting still works
# correctly WITHOUT the proxy in front (this proxy is new), but adding
# the proxy without also teaching the backend to trust these headers
# would make every request appear to come from the same address.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
