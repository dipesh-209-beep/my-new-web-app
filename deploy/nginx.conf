# deploy/nginx.conf
#
# Reverse proxy in front of the backend, added as part of moving this
# stack from "docker-compose for local dev" toward something closer to a
# real deployment. Two things this actually buys, both absent before:
#
#   1. A single, stable ingress point (port 80) instead of clients
#      talking to app/main.py's port 8000 directly -- this is where
#      you'd terminate TLS in a real deployment (see the commented-out
#      443 server block below; wiring up real certificates, e.g. via
#      certbot, is a separate task left for whoever deploys this
#      somewhere with a real domain name).
#   2. A second, independent layer of rate limiting on /admin/login,
#      in front of slowapi's app-level "5/minute" limit
#      (backend/app/api/admin_auth.py). Defense in depth: slowapi's
#      limit can be made accurate across workers by pointing
#      RATE_LIMIT_REDIS_URL at the redis service (see
#      backend/app/core/rate_limit.py's docstring for that trade-off),
#      but this nginx-level limit works identically regardless of how
#      many backend workers or replicas exist, since nginx itself is
#      the single point every request passes through first.
#
# osrm/osrm-foot are deliberately NOT proxied here -- they're internal
# dependencies of the backend (see backend/app/routing/osrm_client.py),
# not something a browser client calls directly, so they have no
# business being reachable through the public-facing proxy at all.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Keeps request bodies at a sane size -- the largest legitimate
    # payload this API accepts is an admin POST /stops or /routes JSON
    # body, nowhere near this limit; this just caps how much an
    # oversized/malicious request can make nginx buffer.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    # Shared across all worker processes (unlike slowapi's in-memory
    # storage default) since it's nginx's own shared-memory zone, not a
    # per-worker count -- so this limit is accurate even with multiple
    # nginx worker_processes, with no Redis involved.
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        location /admin/login {
            limit_req zone=admin_login burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
        }
    }

    # Real TLS termination for a real domain -- uncomment once you have a
    # certificate (e.g. via certbot's nginx plugin, or mounted from
    # wherever your CA issues from) and a place for it to live. Left
    # commented rather than guessed-at, since a wrong path here would
    # silently fail to start nginx at all, and there's no real cert to
    # point at yet.
    #
    # server {
    #     listen 443 ssl;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     location /admin/login {
    #         limit_req zone=admin_login burst=2 nodelay;
    #         limit_req_status 429;
    #         proxy_pass http://backend;
    #         include /etc/nginx/proxy_params.conf;
    #     }
    #
    #     location / {
    #         proxy_pass http://backend;
    #         include /etc/nginx/proxy_params.conf;
    #     }
    # }
}
