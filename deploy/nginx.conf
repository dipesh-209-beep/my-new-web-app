# deploy/nginx.conf
#
# Plain-HTTP ingress, for local development and for a staging box that is
# not yet behind a certificate. Production uses deploy/nginx.https.conf
# instead (mounted by docker-compose.prod.yml).
#
# Two things this buys:
#
#   1. A single, stable ingress point (port 80) instead of clients talking
#      to app/main.py's port 8000 directly.
#   2. A second, independent layer of rate limiting on /admin/login, in
#      front of the application's own limit in
#      backend/app/api/admin_auth.py. Defense in depth: the app's limit is
#      only as good as its counter store (in-process per worker, or Redis
#      if RATE_LIMIT_REDIS_URL/REDIS_URL is set -- see
#      backend/app/core/rate_limit.py), but this limit is nginx's own
#      shared-memory zone, so it behaves identically no matter how many
#      app workers or replicas exist, and keeps working if Redis is down.
#
# The threshold here and the threshold in app/api/admin_auth.py are both
# 10/minute and are meant to stay equal. They used to disagree (5r/m here,
# 10/min there), which quietly made the app's setting unreachable -- the
# effective limit was whatever the *stricter* of the two layers, so
# raising the app's limit appeared to do nothing. If you change one,
# change the other.
#
# osrm/osrm-foot are deliberately NOT proxied here. They are internal
# dependencies of the backend (see backend/app/routing/osrm_client.py),
# not something a browser calls, and docker-compose.yml no longer
# publishes them at all, so there is nothing to proxy to from outside.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # The largest legitimate payload is an admin POST /stops or /routes JSON
    # body, nowhere near this; it just caps how much an oversized request
    # can make nginx buffer.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    # 10 requests/minute sustained, as a token bucket: one token refills every
    # 6 seconds. Paired with burst=2 below, that means a client firing
    # requests back to back gets 3 through and is then limited to one per 6
    # seconds -- stricter in practice than the application's own 10/minute
    # limit, which is the safe direction, but note that this rate is the
    # SUSTAINED rate, not the burst tolerance.
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # Same headers as the HTTPS config. The app sets these too
        # (app/main.py security-headers middleware); the duplication is
        # deliberate, because only nginx can decorate the error pages it
        # generates itself. HSTS is absent here on purpose -- over plain
        # HTTP it is a promise you cannot keep, and browsers ignore it
        # anyway.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /admin/login {
            # burst=2 + the 1-token bucket = 3 immediate attempts allowed.
            # Kept deliberately tight: this is the brute-force control on the
            # proxy path, and it is tighter than the app's 10/minute, so the
            # app limit is never the binding constraint here.
            limit_req zone=admin_login burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
