# Kathmandu Bus Route Finder -- base (hardened) stack.
#
# This file is the PRODUCTION-SAFE baseline: nothing but `proxy` is
# reachable from outside the Docker network. Every dev-only concession --
# published database/Redis/backend ports, the source bind mount, uvicorn
# --reload -- lives in docker-compose.override.yml, which `docker compose`
# auto-loads for local work and which a deployment simply does not use.
#
#   dev:   docker compose up -d              (base + override, hot reload)
#   prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Why the split, given the override is auto-loaded: a hardening change that
# only lives in a separate "production" file is a hardening change nobody
# applies. So the *base* file is the safe one, and the dev file is the one
# that has to ask for exposure explicitly. Getting this backwards was the
# original bug -- port 5432 was published from the base file.
#
# Do NOT add `ports:` to a service here. Use `expose:` (documentation plus
# internal reachability) and, if a human on a laptop genuinely needs the
# port, put it in the override.
#
# Secrets: POSTGRES_PASSWORD / REDIS_PASSWORD / ENVIRONMENT are read from
# the repo-root .env (see .env.example, generated by `make backend-env`).
# They are required, not defaulted, so a missing secret fails at
# `docker compose config` time with a message rather than silently
# deploying a known password.

# Two capability profiles, because "drop ALL" is not universally applicable
# and the difference is not obvious from the outside.
#
# `no-new-privileges` is on for every service: it makes setuid binaries
# useless, which matters because none of these base images are distroless.
#
# `cap-strict` -- no capabilities at all. Correct for the backend: uvicorn
# listens on 8000 (>1024, so no NET_BIND_SERVICE) and the image runs as
# root without dropping privileges, so it never needs one.
#
# `cap-entrypoint` -- drop ALL, then add back exactly the four-ish
# capabilities a privilege-dropping entrypoint needs. The official postgres,
# redis and nginx images start as root and exec `gosu`/`setpriv` to become
# their unprivileged user, and postgres additionally fixes ownership of the
# data directory on first boot. Without CHOWN/SETUID/SETGID/DAC_OVERRIDE
# those images cannot start at all -- the symptom is
# `setresuid failed: Operation not permitted` in the log while the
# container's healthcheck reports nothing useful. Re-adding only these
# five, rather than keeping Docker's default 14, is still a real
# reduction; the goal is to not grant a capability no code path here uses.
x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

x-cap-strict: &cap-strict
  <<: *no-new-privileges
  cap_drop:
    - ALL

x-cap-entrypoint: &cap-entrypoint
  <<: *no-new-privileges
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: ktm_bus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ktm_bus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run `make backend-env`}
      POSTGRES_DB: ktm_bus_route_finder
      # Belt and braces against a stray connection that tries to create
      # objects in the default `public` schema outside the migration
      # chain. The app's own role needs to CREATE there, so this is
      # scoped to the postgres superuser, not the app role.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # No `ports:`. The database is reachable from other containers on this
    # network and from nowhere else. Exposing 5432 hands the whole dataset
    # (and the ability to run arbitrary SQL as the app role) to anything
    # that can reach the host.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktm_bus -d ktm_bus_route_finder"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 256mb
    <<: *cap-entrypoint
    # Schema is created via Alembic migrations (backend/migrations), not an init script.
    # Run `alembic upgrade head` from backend/ after the db container is up.

  # Backs both the response cache (app/core/response_cache.py) and,
  # optionally, the admin-login rate limiter (app/core/rate_limit.py) --
  # see those two files' module docstrings for what each actually gets
  # from this and why they're wired up differently (one has an automatic
  # in-memory fallback if Redis is down, the other doesn't). No volume:
  # this is a pure cache, losing it on restart is fine and arguably
  # preferable (guarantees a clean cache rather than serving whatever was
  # last written before a crash).
  redis:
    image: redis:7-alpine
    container_name: ktm_bus_redis
    restart: unless-stopped
    # requirepass, not "it's on a private network so it's fine". Redis has
    # no authentication by default, and an unauthenticated Redis is not
    # merely a cache-poisoning nuisance: FLUSHALL wipes the shared rate-limit
    # counters, which hands an attacker an unlimited admin-login guess
    # budget, and it can be used to plant values the backend later reads.
    # The network boundary is the primary control; this is the second one.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run `make backend-env`}
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    healthcheck:
      # -a so the healthcheck itself is authenticated; without it this
      # always fails once requirepass is on, and `depends_on:
      # condition: service_healthy` would then never start the backend.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run `make backend-env`}
    <<: *cap-entrypoint

  backend:
    build: ./backend
    container_name: ktm_bus_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started
      osrm-foot:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      # `environment:` wins over `env_file:`, so these override whatever
      # backend/.env says -- which is the point, since backend/.env holds
      # host-local values (localhost:5432 for pytest) that are wrong inside
      # the compose network.
      DATABASE_URL: postgresql://ktm_bus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ktm_bus_route_finder
      OSRM_BASE_URL: http://osrm:5000
      OSRM_FOOT_BASE_URL: http://osrm-foot:5000
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      # "development" by default so a laptop `docker compose up` behaves
      # like a laptop. A deployment must override this -- docker-compose.prod.yml
      # does it explicitly, which is better than trusting an operator to
      # remember a variable, because ENVIRONMENT=production is what turns
      # on validate_production_settings() and with it every startup refusal
      # in app/core/config.py.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Do not let the app trust X-Forwarded-For unless uvicorn is started
      # with --proxy-headers --forwarded-allow-ips=<proxy's address>. When
      # the proxy is in front that is correct; app/core/rate_limit.py refuses
      # to read the forwarded headers at all unless this is set, so the
      # failure mode is "rate limit keys on the proxy's address", not
      # "anyone can forge a fresh bucket per request".
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # The geographic congestion-zone CSV is a *file* the app reads at
      # runtime (app/routing/congestion_zones.py), not database data, and
      # the image cannot contain it: the build context is ./backend, which
      # cannot reach data/ at the repo root, and backend/.dockerignore
      # excludes data/ regardless. So it is bind-mounted in (see `volumes:`
      # below) and pointed at here -- the same pattern the osrm services
      # use for their pre-built .osrm files. Without this the whole
      # geographic half of the congestion model silently no-ops in every
      # containerised deployment; load_zones() now logs a warning if the
      # path is wrong, so a misconfiguration is visible rather than a
      # feature that is mysteriously missing.
      CONGESTION_ZONES_PATH: /app/data/congestion_zones.csv
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    volumes:
      # Single file, not the whole data/ directory: this is the only file
      # the app reads from data/ at runtime. Read-only, so a compromised
      # process cannot rewrite the congestion model it routes on, and the
      # host copy stays the single source of truth (it is tracked in git,
      # so a fresh clone has it).
      - ./data/congestion_zones.csv:/app/data/congestion_zones.csv:ro
    # No `ports:` and no bind mount. The image's baked-in code is what
    # runs, so a production host cannot change the app by editing a file.
    # (Development re-adds both in the override.)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    read_only: true
    tmpfs:
      # read_only above needs somewhere writable for the few things
      # CPython insists on: /tmp for any temp file, and the ASGI/uvicorn
      # socket dir.
      - /tmp:rw,noexec,nosuid,size=64m
    <<: *cap-strict
    # DAC_OVERRIDE, deliberately, on this one service.
    #
    # backend/.env is mode 0600 (scripts/gen_backend_env.py enforces it)
    # and the development override bind-mounts the whole backend/ directory,
    # so /app/.env exists in the container owned by the host user. The
    # container runs as root, but `cap_drop: ALL` includes
    # CAP_DAC_OVERRIDE, so root could not read it -- and two libraries
    # independently try: pydantic-settings, and the starlette Config that
    # slowapi builds for its own environment lookups. Both raised
    # PermissionError during import, which took the service down at its
    # health check and returned 504 through nginx for the whole stack.
    #
    # The alternative -- running the container as the host uid so the file
    # is owned rather than merely readable -- is not portable: the uid
    # differs per machine and per CI runner, and hardcoding one produces
    # either a permission error or a needlessly permissive mode.
    #
    # This is a narrow grant on a service with no published port, reachable
    # only from the compose network, and the capability it buys is "read a
    # file this container was explicitly given a copy of". Note it is only
    # needed in development, where the bind mount drags the file in;
    # docker-compose.prod.yml does not bind-mount backend/, so the
    # container's configuration comes entirely from `env_file:` (read by
    # the Docker daemon as root) and the file is never opened by the
    # process.
    cap_add:
      - DAC_OVERRIDE

  # The only service with a published port. Single ingress point for the
  # whole stack; see deploy/nginx.conf.
  proxy:
    image: nginx:1.27-alpine
    container_name: ktm_bus_proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # HTTP only. Real deployments terminate TLS here -- see
      # docker-compose.prod.yml, which mounts certificates and switches
      # this to 443.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    read_only: true
    tmpfs:
      # nginx insists on writing its pid, temp bodies and proxy buffers
      # somewhere; with a read-only root these must be tmpfs.
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *cap-entrypoint

  # Internal-only. Not proxied by nginx (see deploy/nginx.conf) and not
  # published: these are dependencies of the backend, not something a
  # browser calls.
  osrm:
    image: osrm/osrm-backend
    container_name: osrm_ktm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/nepal-latest.osrm
    expose:
      - "5000"
    volumes:
      - ./backend:/data:ro
    <<: *cap-strict

  # Separate instance for pedestrian directions (walking to the nearest
  # stop). A single osrm-routed process only serves the profile its .osrm
  # file was extracted with, so this needs its own extract
  # (nepal-latest-foot.osrm, built with foot.lua) and its own port.
  osrm-foot:
    image: osrm/osrm-backend
    container_name: osrm_ktm_foot
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/nepal-latest-foot.osrm
    expose:
      - "5000"
    volumes:
      - ./backend:/data:ro
    <<: *cap-strict

volumes:
  pgdata:
